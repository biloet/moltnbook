# Fly.io: https://fly.io/docs/reference/configuration/
# Ganti nama app dengan nama unik milik Anda.
app = "otonom-institute-ganti-nama"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/otonom.db"
  TRUST_PROXY = "1"

[[mounts]]
  source = "otonom_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
